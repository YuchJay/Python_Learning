", "from": "LT", "label": "\u5305\u542b", "title": "\u5305\u542b", "to": "ROC"}, {"arrows": "to", "from": "ZT", "label": "\u5305\u542b", "title": "\u5305\u542b", "to": "ROC"}, {"arrows": "to", "from": "ROC", "label": "\u51b3\u5b9a", "title": "\u51b3\u5b9a", "to": "Stability"}, {"arrows": "to", "from": "Pole_Zero", "label": "\u8fb9\u754c\u7531\u5176\u51b3\u5b9a", "title": "\u8fb9\u754c\u7531\u5176\u51b3\u5b9a", "to": "ROC"}, {"arrows": "to", "from": "Pole_Zero", "label": "\u6781\u70b9\u5728\u5de6\u534a\u5e73\u9762/\u5355\u4f4d\u5706\u5185", "title": "\u6781\u70b9\u5728\u5de6\u534a\u5e73\u9762/\u5355\u4f4d\u5706\u5185", "to": "Stability"}]);

                  nodeColors = {};

                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"physics": {"barnesHut": {"gravitationalConstant": -5000, "centralGravity": 0.1, "springLength": 220, "springConstant": 0.04, "damping": 0.09, "avoidOverlap": 1}, "minVelocity": 0.75}, "nodes": {"font": {"size": 14, "strokeWidth": 2, "strokeColor": "#222222"}}, "edges": {"font": {"size": 11, "align": "middle"}, "smooth": {"type": "dynamic"}}, "manipulation": {"enabled": true, "initiallyActive": true}};
